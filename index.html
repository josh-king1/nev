<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAU Campus Navigator</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

body{
font-family:'Inter',sans-serif;
background:#f3f4f6;
padding-bottom:6rem;
}

#map{
height:450px;
width:100%;
margin-top:1rem;
margin-bottom:1rem;
}

</style>
</head>

<body class="px-4">

<div class="max-w-6xl mx-auto bg-white shadow-2xl rounded-xl p-6">

<header class="text-center mb-8">

<h1 class="text-3xl font-extrabold flex justify-center items-center gap-3">
<i data-lucide="map-pin" class="w-8 h-8 text-blue-600"></i>
AAU Campus Navigator
</h1>

<p class="text-gray-500">
Ambrose Alli University, Ekpoma
</p>

</header>


<!-- CURRENT LOCATION -->

<div class="bg-blue-50 p-4 rounded mb-6">

<p class="font-semibold text-blue-700">
Your Current Location
</p>

<p id="locationDisplay" class="text-sm">
Faculty of Physical Sciences
</p>

</div>


<!-- MAP -->

<div id="map" class="rounded-xl shadow-lg"></div>


<!-- ROUTE INFO -->

<div id="routeInfo" class="hidden bg-green-50 border-l-4 border-green-600 p-4 rounded mb-6">

<h3 class="font-bold text-green-700">
Navigation Info
</h3>

<p id="distanceInfo"></p>
<p id="durationInfo"></p>

</div>


<!-- SEARCH -->

<input
type="text"
id="searchInput"
placeholder="Search faculty..."
class="w-full border p-3 rounded mb-6"
onkeyup="searchFaculty()"
/>


<h2 class="text-xl font-bold mb-4">
Faculties
</h2>

<div id="facultyList" class="grid sm:grid-cols-2 gap-4"></div>

</div>


<!-- BOTTOM NAVIGATION -->

<div class="fixed bottom-0 left-0 right-0 bg-white border-t-4 border-blue-600 shadow-lg">

<div class="flex justify-around items-center h-16">

<button onclick="goToHome()" class="text-blue-600">
<i data-lucide="home" class="w-7 h-7"></i>
</button>

<button onclick="alert('AAU Campus Navigator helps students find locations easily')" class="text-gray-600">
<i data-lucide="info" class="w-7 h-7"></i>
</button>

</div>

</div>



<script>

lucide.createIcons();

let map,userMarker,destinationMarker,routeLine;


/* FIXED CURRENT LOCATION */

let userLat=6.7455;
let userLng=6.0745;


/* FACULTY DATA */

const faculties=[

{ id:1,name:"Agriculture",lat:6.7462,lng:6.0721,icon:"leaf",image:"i"},

{ id:2,name:"Arts",lat:6.7395,lng:6.0755,icon:"palette",image:"art.jpg"},

{ id:3,name:"Education",lat:6.7435,lng:6.0782,icon:"book-open",image:"edu.jpg"},

{ id:4,name:"Engineering",lat:6.7420,lng:6.0710,icon:"cpu",image:"ene.jpg"},

{ id:5,name:"Environmental Studies",lat:6.7405,lng:6.0732,icon:"layout",image:"env.jpg"},

{ id:6,name:"Law",lat:6.7410,lng:6.0760,icon:"gavel",image:"images/law.jpg"},

{ id:7,name:"Life Sciences",lat:6.7448,lng:6.0740,icon:"microscope",image:"life.jpg"},

{ id:8,name:"Physical Sciences",lat:6.7455,lng:6.0745,icon:"atom",image:"ps.jpg"},

{ id:9,name:"Management Sciences",lat:6.7388,lng:6.0742,icon:"briefcase",image:"man.jpg"},

{ id:10,name:"Social Sciences",lat:6.7428,lng:6.0775,icon:"users",image:"sos.jpg"}

];



/* INITIALIZE MAP */

window.onload=function(){

map=L.map('map').setView([userLat,userLng],17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);


/* CURRENT LOCATION MARKER */

userMarker=L.marker([userLat,userLng])
.addTo(map)
.bindPopup("Faculty of Physical Sciences")
.openPopup();


renderFaculties();

}



/* DISPLAY FACULTIES */

function renderFaculties(){

const container=document.getElementById("facultyList");

container.innerHTML="";

faculties.forEach(f=>{

L.marker([f.lat,f.lng])
.addTo(map)
.bindPopup(`

<img src="${f.image}" class="w-40 rounded mb-2">

<h3 class="font-bold">${f.name}</h3>

<button onclick='navigateToFaculty(${JSON.stringify(f)})'
class="bg-blue-600 text-white px-2 py-1 rounded mt-2">
Navigate
</button>

`);

const div=document.createElement("div");

div.className="bg-gray-50 p-4 rounded-lg shadow hover:shadow-lg";

div.innerHTML=`

<img src="${f.image}" class="w-full h-32 object-cover rounded mb-3">

<div class="flex items-center gap-2 mb-2">
<i data-lucide="${f.icon}" class="w-5 h-5 text-blue-600"></i>
<h3 class="font-semibold">${f.name}</h3>
</div>

<button onclick='navigateToFaculty(${JSON.stringify(f)})'
class="mt-2 bg-green-600 text-white px-3 py-2 rounded w-full">
Navigate
</button>

`;

container.appendChild(div);

});

lucide.createIcons();

}



/* SEARCH FUNCTION */

function searchFaculty(){

const input=document.getElementById("searchInput").value.toLowerCase();

const filtered=faculties.filter(f=>f.name.toLowerCase().includes(input));

const container=document.getElementById("facultyList");

container.innerHTML="";

filtered.forEach(f=>{

const div=document.createElement("div");

div.className="bg-gray-50 p-4 rounded shadow";

div.innerHTML=`

<img src="${f.image}" class="w-full h-32 object-cover rounded mb-3">

<h3 class="font-semibold">${f.name}</h3>

<button onclick='navigateToFaculty(${JSON.stringify(f)})'
class="mt-2 bg-green-600 text-white px-3 py-1 rounded w-full">
Navigate
</button>

`;

container.appendChild(div);

});

}



/* NAVIGATION */

async function navigateToFaculty(f){

if(destinationMarker) map.removeLayer(destinationMarker);

if(routeLine) map.removeLayer(routeLine);


destinationMarker=L.marker([f.lat,f.lng])
.addTo(map)
.bindPopup(f.name)
.openPopup();


const url=`https://router.project-osrm.org/route/v1/foot/${userLng},${userLat};${f.lng},${f.lat}?overview=full&geometries=geojson`;

const res=await fetch(url);

const data=await res.json();

if(!data.routes.length) return;


routeLine=L.geoJSON(data.routes[0].geometry,{
style:{color:"blue",weight:6}
}).addTo(map);


const distance=(data.routes[0].distance/1000).toFixed(2);

const duration=(data.routes[0].duration/60).toFixed(1);


document.getElementById("routeInfo").classList.remove("hidden");

document.getElementById("distanceInfo").innerHTML=`Distance: ${distance} km`;

document.getElementById("durationInfo").innerHTML=`Walking Time: ${duration} mins`;

}



/* HOME BUTTON */

function goToHome(){

map.setView([userLat,userLng],17);

}

</script>

</body>
</html>
